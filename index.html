<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FreeCinema HTTPS Test</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0a0a0c;color:#fff}
header{padding:14px 16px;border-bottom:1px solid #222;background:#101014}
h1{margin:0 0 6px;font-size:25px}.sub{color:#aaa;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px}
.card{background:#15151a;border:1px solid #26262d;border-radius:18px;overflow:hidden;cursor:pointer}
.poster{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(145deg,#292933,#111)}
.meta{padding:12px}.title{font-weight:800}.en{font-size:12px;color:#aaa;margin-top:4px}
.badge{display:inline-block;margin:7px 5px 0 0;padding:4px 7px;border-radius:999px;background:#27272d;color:#ccc;font-size:11px}
dialog{width:min(900px,96vw);border:0;border-radius:20px;background:#111;color:#fff;padding:0}
dialog::backdrop{background:rgba(0,0,0,.82)}
.modal{padding:14px}.close{float:right;border:0;border-radius:10px;padding:9px 12px;background:#24242a;color:#fff}
video{width:100%;max-height:72vh;background:#000;border-radius:14px}
.status{margin:10px 0;color:#aaa;font-size:13px;line-height:1.5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar button{border:0;border-radius:10px;padding:9px 12px;background:#24242a;color:#fff}
.log{margin-top:10px;padding:10px;background:#18181d;border-radius:12px;color:#aaa;font-size:12px;white-space:pre-wrap}
.ok{color:#8fe59d}.bad{color:#ff9a9a}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>FreeCinema</h1>
<div class="sub">HTTPS 实际播放检测版 · 只有真正有画面且时间在走才算成功</div>
</header>

<main id="grid" class="grid"></main>

<dialog id="dlg">
<div class="modal">
<button id="closeBtn" class="close">关闭</button>
<h2 id="movieTitle"></h2>
<video id="player" controls playsinline preload="auto"></video>
<div class="toolbar">
<button id="switchBtn">切换下一线路</button>
<button id="retryBtn">重新检测</button>
</div>
<div id="status" class="status"></div>
<div id="log" class="log"></div>
</div>
</dialog>

<script>
const movies = [
  {
    zh:"大兔子",
    en:"Big Buck Bunny",
    year:"2008",
    icon:"🐰",
    sources:[
      {name:"MP4 主线路",url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"},
      {name:"MP4 备用线路",url:"https://www.w3schools.com/html/mov_bbb.mp4"},
      {name:"HLS 备用",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}
    ]
  },
  {
    zh:"钢铁之泪",
    en:"Tears of Steel",
    year:"2012",
    icon:"🤖",
    sources:[
      {name:"Blender 720p",url:"https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov"},
      {name:"HLS 备用",url:"https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8"}
    ]
  }
];

const grid=document.getElementById('grid');
const dlg=document.getElementById('dlg');
const player=document.getElementById('player');
const statusEl=document.getElementById('status');
const logEl=document.getElementById('log');

let currentMovie=null;
let sourceIndex=0;
let watchdog=null;
let playbackCheck=null;
let startTime=0;

function render(){
  grid.innerHTML='';
  movies.forEach(m=>{
    const card=document.createElement('article');
    card.className='card';
    card.innerHTML=`<div class="poster">${m.icon}</div>
      <div class="meta">
        <div class="title">${m.zh}</div>
        <div class="en">${m.en}</div>
        <span class="badge">${m.year}</span>
        <span class="badge">${m.sources.length} 条线路</span>
      </div>`;
    card.onclick=()=>openMovie(m);
    grid.appendChild(card);
  });
}

function log(msg, cls=''){
  const t=new Date().toLocaleTimeString();
  logEl.innerHTML += `${logEl.innerHTML?'<br>':''}<span class="${cls}">[${t}] ${msg}</span>`;
  logEl.scrollTop=logEl.scrollHeight;
}

function cleanupTimers(){
  clearTimeout(watchdog);
  clearInterval(playbackCheck);
}

function openMovie(m){
  currentMovie=m;
  sourceIndex=0;
  document.getElementById('movieTitle').textContent=`${m.zh} · ${m.en}`;
  logEl.innerHTML='';
  dlg.showModal();
  trySource();
}

function trySource(){
  cleanupTimers();
  if(!currentMovie)return;

  if(sourceIndex>=currentMovie.sources.length){
    statusEl.innerHTML='<span class="bad">所有线路都未通过“真实播放”检测</span>';
    log('已尝试全部线路。','bad');
    player.removeAttribute('src');
    player.load();
    return;
  }

  const s=currentMovie.sources[sourceIndex];
  statusEl.textContent=`正在检测：${s.name}`;
  log(`尝试 ${sourceIndex+1}/${currentMovie.sources.length}: ${s.name}`);

  player.pause();
  player.removeAttribute('src');
  player.load();
  player.src=s.url;
  player.currentTime=0;
  player.load();

  startTime=performance.now();
  const playPromise=player.play();
  if(playPromise) playPromise.catch(()=>{});

  // 8秒内必须满足：有视频尺寸 + currentTime 真正前进
  let lastTime=0;
  let progressedCount=0;

  playbackCheck=setInterval(()=>{
    const hasFrame = player.videoWidth > 0 && player.videoHeight > 0;
    const progressed = player.currentTime > lastTime + 0.05;
    if(progressed) progressedCount++;
    lastTime=player.currentTime;

    if(hasFrame && progressedCount >= 2 && player.currentTime > 0.3){
      cleanupTimers();
      statusEl.innerHTML=`<span class="ok">当前线路：${s.name} · 真实播放成功</span>`;
      log(`成功：video=${player.videoWidth}x${player.videoHeight}, currentTime=${player.currentTime.toFixed(1)}s`,'ok');
    }
  },700);

  watchdog=setTimeout(()=>{
    const hasFrame = player.videoWidth > 0 && player.videoHeight > 0;
    const reallyPlaying = hasFrame && player.currentTime > 0.3 && !player.paused;

    if(!reallyPlaying){
      cleanupTimers();
      log(`失败：8秒内没有检测到真实画面/播放进度 → 自动换源`,'bad');
      sourceIndex++;
      trySource();
    }
  },8000);
}

player.addEventListener('error',()=>{
  cleanupTimers();
  const s=currentMovie?.sources[sourceIndex];
  log(`${s?.name||'当前线路'} 触发 media error → 自动换源`,'bad');
  sourceIndex++;
  setTimeout(trySource,300);
});

player.addEventListener('waiting',()=>{
  const s=currentMovie?.sources[sourceIndex];
  statusEl.textContent=`${s?.name||''} · 正在缓冲…`;
});

document.getElementById('switchBtn').onclick=()=>{
  cleanupTimers();
  sourceIndex++;
  if(sourceIndex>=currentMovie.sources.length) sourceIndex=0;
  trySource();
};

document.getElementById('retryBtn').onclick=()=>{
  cleanupTimers();
  trySource();
};

document.getElementById('closeBtn').onclick=()=>{
  cleanupTimers();
  player.pause();
  player.removeAttribute('src');
  player.load();
  dlg.close();
};

dlg.addEventListener('close',()=>{
  cleanupTimers();
  player.pause();
  player.removeAttribute('src');
  player.load();
});

render();
</script>
</body>
</html>
