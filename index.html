<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.json" />
  <title>FreeCinema</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif; }
    body { margin:0; background:#0b0b0b; color:#fff; }
    header { position:sticky; top:0; z-index:10; backdrop-filter:blur(18px); background:rgba(10,10,10,.82); padding:14px 16px; border-bottom:1px solid #222; }
    h1 { margin:0 0 10px; font-size:24px; }
    .search { display:flex; gap:8px; }
    input { flex:1; border:1px solid #333; background:#171717; color:#fff; border-radius:12px; padding:12px 14px; font-size:16px; }
    button { border:0; border-radius:12px; padding:12px 14px; font-size:15px; }
    .primary { background:#fff; color:#000; font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; padding:14px; }
    .card { background:#151515; border:1px solid #232323; border-radius:16px; overflow:hidden; }
    .poster { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; background:#222; }
    .meta { padding:10px; }
    .title { font-weight:700; line-height:1.25; min-height:2.5em; }
    .year { color:#aaa; font-size:13px; margin-top:6px; }
    .status { padding:24px; color:#aaa; text-align:center; }
    dialog { width:min(720px,94vw); border:none; border-radius:18px; padding:0; background:#111; color:#fff; }
    dialog::backdrop { background:rgba(0,0,0,.75); }
    .modal { padding:14px; }
    video { width:100%; border-radius:14px; background:#000; }
    .close { float:right; background:#222; color:#fff; }
    .desc { color:#ccc; line-height:1.5; white-space:pre-wrap; }
    @media (min-width:700px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr));} }
  </style>
</head>
<body>
<header>
  <h1>FreeCinema</h1>
  <div class="search">
    <input id="q" placeholder="搜索公开影视" />
    <button class="primary" id="searchBtn">搜索</button>
  </div>
</header>

<div id="status" class="status">正在加载公开影视…</div>
<main id="grid" class="grid"></main>

<dialog id="dlg">
  <div class="modal">
    <button class="close" id="closeBtn">关闭</button>
    <h2 id="movieTitle"></h2>
    <video id="player" controls playsinline></video>
    <p id="movieMeta"></p>
    <p id="movieDesc" class="desc"></p>
  </div>
</dialog>

<script>
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const q = document.getElementById('q');
const dlg = document.getElementById('dlg');
const player = document.getElementById('player');

async function searchMovies(term='') {
  statusEl.textContent = '正在加载…';
  grid.innerHTML = '';
  const base = 'mediatype:movies AND (licenseurl:*publicdomain* OR "public domain")';
  const query = term.trim() ? `${base} AND (title:(${term}) OR description:(${term}))` : base;
  const params = new URLSearchParams();
  params.set('q', query);
  ['identifier','title','description','year','creator'].forEach(v=>params.append('fl[]',v));
  params.append('sort[]','downloads desc');
  params.set('rows','40');
  params.set('page','1');
  params.set('output','json');

  try {
    const res = await fetch('https://archive.org/advancedsearch.php?' + params.toString());
    const data = await res.json();
    const docs = data?.response?.docs || [];
    if (!docs.length) {
      statusEl.textContent = '没找到结果';
      return;
    }
    statusEl.textContent = '';
    docs.forEach(movie => {
      const card = document.createElement('article');
      card.className = 'card';
      const img = document.createElement('img');
      img.className = 'poster';
      img.src = `https://archive.org/services/img/${movie.identifier}`;
      img.alt = movie.title || movie.identifier;
      img.loading = 'lazy';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `<div class="title">${escapeHtml(movie.title || movie.identifier)}</div>
                        <div class="year">${escapeHtml(movie.year || '')}</div>`;
      card.append(img, meta);
      card.onclick = () => openMovie(movie);
      grid.appendChild(card);
    });
  } catch (e) {
    statusEl.textContent = '加载失败，请稍后再试';
  }
}

async function openMovie(movie) {
  document.getElementById('movieTitle').textContent = movie.title || movie.identifier;
  document.getElementById('movieMeta').textContent = [movie.creator, movie.year].filter(Boolean).join(' · ');
  document.getElementById('movieDesc').textContent = stripHtml(movie.description || '');
  player.removeAttribute('src');
  player.load();
  dlg.showModal();
  try {
    const res = await fetch(`https://archive.org/metadata/${movie.identifier}`);
    const data = await res.json();
    const files = (data.files || []).filter(f => {
      const n = (f.name || '').toLowerCase();
      const fmt = (f.format || '').toLowerCase();
      return n.endsWith('.mp4') || n.endsWith('.m4v') || fmt.includes('h.264') || fmt.includes('mpeg4');
    });
    let file = files.find(f => (f.source || '').toLowerCase() === 'derivative') || files[0];
    if (!file) throw new Error('no video');
    player.src = `https://archive.org/download/${movie.identifier}/${encodeURIComponent(file.name).replaceAll('%2F','/')}`;
    await player.play().catch(()=>{});
  } catch (e) {
    alert('这个条目没有找到可直接播放的视频文件');
  }
}

function stripHtml(s) {
  const d = document.createElement('div');
  d.innerHTML = Array.isArray(s) ? s.join('\n') : s;
  return d.textContent || d.innerText || '';
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('searchBtn').onclick = ()=>searchMovies(q.value);
q.addEventListener('keydown', e => { if (e.key === 'Enter') searchMovies(q.value); });
document.getElementById('closeBtn').onclick = ()=> { player.pause(); dlg.close(); };
dlg.addEventListener('close', ()=> { player.pause(); player.removeAttribute('src'); player.load(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
searchMovies();
</script>
</body>
</html>
